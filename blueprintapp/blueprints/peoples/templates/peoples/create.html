{% extends "base.html" %}
{% block title %}Create People{% endblock %}

{% block content %}
    <h1>Create People</h1>
    <form action="{{ url_for('peoples.create') }}" method="post">
        <input type="text" name="name" placeholder="Name" required /> <br>
        <input type="number" name="age" placeholder="Age" required /> <br>
        <input type="text" name="job" placeholder="Job" required /> <br>
        <input type="submit" value="Create" /> <br>
    </form>
{% endblock %}
